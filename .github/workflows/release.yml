name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check-version
      - id: pack
        shell: bash
        run: |
          PACKAGE="$(npm pack --silent)"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
      - run: gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.package }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
